<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">安装流程示意图</title><desc id="desc">解压完整项目，加载 extension 文件夹，需要邮件时再启动本地服务。</desc>
  <rect width="1200" height="280" rx="20" fill="#f6f5f2"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="36" y="42" font-size="22" font-weight="bold" fill="#242b39">司凤转发 · 第一次安装：加载扩展，邮件服务可选</text>
    <text x="36" y="68" font-size="14" fill="#747b87">流程示意图；下文另外提供真实插件界面的演示截图。</text>
    <g fill="white" stroke="#e7e7e4"><rect x="36" y="94" width="340" height="150" rx="14"/><rect x="430" y="94" width="340" height="150" rx="14"/><rect x="824" y="94" width="340" height="150" rx="14"/></g>
    <g fill="#d93553" font-size="16" font-weight="bold"><text x="60" y="125">01 · 完整项目</text><text x="454" y="125">02 · 浏览器扩展</text><text x="848" y="125">03 · 邮件告警（可选）</text></g>
    <g fill="#242b39" font-size="22" font-weight="bold"><text x="60" y="163">下载并解压</text><text x="454" y="163">加载 extension 文件夹</text><text x="848" y="163">需要提醒时再配置</text></g>
    <g fill="#747b87" font-size="15"><text x="60" y="195">保留 extension / runner / 启动脚本</text><text x="60" y="220">普通使用不需要 Node.js 或构建</text><text x="454" y="195">edge://extensions → 开发者模式</text><text x="454" y="220">选择包含 manifest.json 的那一层</text><text x="848" y="195">Python 3.10+ · 本机端口 17321</text><text x="848" y="220">关闭邮件告警时可跳过此步</text></g>
    <g fill="#d93553" font-size="28"><text x="390" y="178">→</text><text x="784" y="178">→</text></g>
  </g>
</svg>
